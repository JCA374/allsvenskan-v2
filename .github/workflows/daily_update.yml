name: Daily forecast update

on:
  schedule:
    - cron: "0 */11 * * *"  # every 11 hours
  workflow_dispatch:         # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed to push the updated data files back

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # silence Node.js 20 deprecation warning

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/daily_update.py

      - name: Commit updated data & forecast
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/clean/ \
            data/processed/ \
            data/raw/ \
            models/ \
            reports/simulations/
          git diff --cached --quiet || git commit -m "chore: daily forecast update $(date -u '+%Y-%m-%d')"

      - name: Push
        run: git push

  ping:
    runs-on: ubuntu-latest
    # Run after update so the app has fresh data before we wake it
    needs: update
    if: always()   # ping even if update had no new data to commit

    steps:
      - name: Wake Streamlit app
        # STREAMLIT_APP_URL must be set as a GitHub Actions variable:
        # Repo → Settings → Secrets and variables → Actions → Variables → New
        # e.g. https://yourapp.streamlit.app
        run: |
          URL="${{ vars.STREAMLIT_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "STREAMLIT_APP_URL not set — skipping ping"
            exit 0
          fi
          echo "Pinging $URL"
          curl -sf --max-time 30 "$URL" -o /dev/null && echo "App is up" || echo "App returned non-200 (may be waking up)"
